name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the minimum declared in engines; 22 is the current LTS.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: dist/ is gitignored, and typecheck + the cross-package conformance
      # tests (drizzle engine≡SQL, next, react) import @vetojs/core from its built output.
      # Without this, a clean checkout cannot resolve @vetojs/core and CI never runs them.
      - run: pnpm build
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm knip
      - run: pnpm type-bench

  react-compat:
    # @vetojs/react declares react >=18; prove it against the oldest supported major.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Downgrade to React 18
        run: >
          pnpm --filter @vetojs/react add -D
          react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18
      - run: pnpm vitest run --project @vetojs/react
      - run: pnpm typecheck

  package:
    # What consumers actually install: publishable manifests, exports and type resolution.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx --yes publint packages/core
      - run: npx --yes publint packages/react
      # ESM-only is deliberate, so the CJS-require finding is expected and ignored.
      - run: npx --yes @arethetypeswrong/cli --pack packages/core --ignore-rules cjs-resolves-to-esm
      - run: npx --yes @arethetypeswrong/cli --pack packages/react --ignore-rules cjs-resolves-to-esm
