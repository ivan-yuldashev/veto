name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm demo:react:build
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm knip
      - run: pnpm type-bench

  react-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Downgrade to React 18
        run: >
          pnpm --filter @vetojs/react add -D
          react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18
      - run: pnpm vitest run --project @vetojs/react
      - run: pnpm typecheck

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx --yes publint packages/core
      - run: npx --yes publint packages/react
      - run: npx --yes publint packages/next
      - run: npx --yes @arethetypeswrong/cli --pack packages/core --profile esm-only
      - run: npx --yes @arethetypeswrong/cli --pack packages/react --profile esm-only
      - run: npx --yes @arethetypeswrong/cli --pack packages/next --profile esm-only
